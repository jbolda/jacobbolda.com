name: build and push draft

on: pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-draft:
    name: build draft
    environment: beta
    runs-on: ubuntu-latest
    env:
      MISE_IDIOMATIC_VERSION_FILE_ENABLE_TOOLS: node,npm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - run: npm ci
      - name: sync recipes from obsidian
        if: success()
        env:
          OBSIDIAN_EMAIL: ${{ secrets.OBSIDIAN_EMAIL }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
          OBSIDIAN_SYNC_PASSWORD: ${{ secrets.OBSIDIAN_SYNC_PASSWORD }}
          OBSIDIAN_VAULT_NAME: ${{ secrets.OBSIDIAN_VAULT_NAME }}
        run: |
          npx obsidian-headless login --email "$OBSIDIAN_EMAIL" --password "$OBSIDIAN_PASSWORD"
          npx obsidian-headless sync-setup --vault "$OBSIDIAN_VAULT_NAME" --path ./obsidian-vault --password "$OBSIDIAN_SYNC_PASSWORD" --device-name "github-actions"
          npx obsidian-headless sync-config --path ./obsidian-vault --mode pull-only
          npx obsidian-headless sync --path ./obsidian-vault
          npm run copy-from-vault -- ./obsidian-vault
      - name: revoke obsidian session
        if: always()
        run: |
          npx obsidian-headless sync-unlink --path ./obsidian-vault || true
          npx obsidian-headless logout || true
      - name: deploy
        if: success()
        env:
          NODE_ENV: production
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          ARTICLE_FETCH_ENDPOINT: ${{ secrets.ARTICLE_FETCH_ENDPOINT }}
          NETLIFY_MESSAGE: ${{ github.event.pull_request.html_url }}
        run: npx netlify deploy --dir=dist --message "$NETLIFY_MESSAGE"
