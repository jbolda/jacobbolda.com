name: build and push to production

on:
  push:
    branches:
      - production
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild-website-from-airtable-hook]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-production:
    name: build production
    environment: production
    runs-on: ubuntu-latest
    env:
      MISE_IDIOMATIC_VERSION_FILE_ENABLE_TOOLS: node,npm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - run: npm ci
      - name: deploy
        if: success()
        env:
          NODE_ENV: production
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          ARTICLE_FETCH_ENDPOINT: ${{ secrets.ARTICLE_FETCH_ENDPOINT }}
          NETLIFY_MESSAGE: ${{ github.event.head_commit.message || github.event.ref }}
        run: npx netlify deploy --dir=dist --prod --message "$NETLIFY_MESSAGE"
